server:
  port: 8080

spring:
  application:
    # // TODO: RENAME ME
    name: spring-6-project-template
  docker:
    compose:
      enabled: false
      stop:
        command: down

management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      # WARNING: SECURITY RISK - DO NOT USE IN PRODUCTION ENVIRONMENT
      # This configuration exposes sensitive data and should only be used for development or testing purposes.
      # Ensure this is disabled in any environment where security is a concern.
      show-values: ALWAYS
    health:
      probes:
        enabled: true
      show-details: always
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: full
  observations:
    annotations:
      enabled: true
  tracing:
    enabled: true
    propagation:
      type: w3c
      produce: w3c
      consume: w3c
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      correlation:
        # Also make baggage available in MDC for logging
        fields:
          - testBaggage
        enabled: true
      # Allows receiving the "baggage: testBaggage=..." header set in the http request
      remote-fields:
        - testBaggage
      # COPIES the value from baggage into the span labels (attributes)
      tag-fields:
        - testBaggage
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
